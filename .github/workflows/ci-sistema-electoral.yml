# Pipeline CI/CD del Sistema de Información Electoral (FIS 2610 - Parcial 2)
# Se activa con cada push a la rama del equipo (y en pull requests hacia develop/main).
# Si la rama de su equipo tiene otro nombre, cámbienlo en "branches".
name: CI - Sistema Electoral

on:
  push:
    branches: [ "grupo-electoral" ]
    paths:
      - "sistema-electoral/**"
      - ".github/workflows/ci-sistema-electoral.yml"
  pull_request:
    branches: [ "develop", "main" ]
    paths:
      - "sistema-electoral/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: sistema-electoral

env:
  JAVA_VERSION: "17"
  MAVEN_ARGS: "-B -ntp"

jobs:
  # Etapa 1: el código compila con Java 17 (falla rápido ante errores de sintaxis o tipos).
  compilar:
    name: 1. Compilación
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: sistema-electoral/pom.xml

      - name: Compilar
        run: mvn $MAVEN_ARGS compile

  # Etapa 2: se ejecutan todas las pruebas unitarias (JUnit 5).
  pruebas:
    name: 2. Pruebas unitarias
    needs: compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: sistema-electoral/pom.xml

      - name: Ejecutar pruebas
        run: mvn $MAVEN_ARGS test

      - name: Resumen de pruebas
        if: always()
        run: |
          total=0; fallas=0; errores=0
          for f in target/surefire-reports/TEST-*.xml; do
            t=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            fa=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            e=$(grep -o 'errors="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            total=$((total + t)); fallas=$((fallas + fa)); errores=$((errores + e))
          done
          {
            echo "## Pruebas unitarias"
            echo "| Total | Exitosas | Fallidas | Errores |"
            echo "|---|---|---|---|"
            echo "| $total | $((total - fallas - errores)) | $fallas | $errores |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reportes de Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: sistema-electoral/target/surefire-reports/

  # Etapa 3: cobertura de código con JaCoCo.
  cobertura:
    name: 3. Cobertura (JaCoCo)
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: sistema-electoral/pom.xml

      - name: Generar reporte de cobertura
        run: mvn $MAVEN_ARGS verify

      - name: Resumen de cobertura
        run: |
          awk -F, 'NR>1 { lm+=$8; lc+=$9; bm+=$6; bc+=$7 }
            END {
              printf "## Cobertura JaCoCo\n| Líneas | Ramas |\n|---|---|\n| %.1f%% | %.1f%% |\n",
                100*lc/(lm+lc), (bm+bc) ? 100*bc/(bm+bc) : 100
            }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte HTML de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: sistema-electoral/target/site/jacoco/

  # Etapa 4: empaquetado del artefacto (.jar) listo para entregar/desplegar.
  empaquetar:
    name: 4. Empaquetado
    needs: cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: sistema-electoral/pom.xml

      - name: Generar JAR
        run: mvn $MAVEN_ARGS package -DskipTests

      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        with:
          name: sistema-electoral-jar
          path: sistema-electoral/target/*.jar
